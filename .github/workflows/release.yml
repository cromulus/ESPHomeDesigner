name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'custom_components/esphome_designer/manifest.json'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      
      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r .version custom_components/esphome_designer/manifest.json)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          if [[ $VERSION == *"rc"* || $VERSION == *"beta"* || $VERSION == *"alpha"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build Frontend
        run: |
          npm ci
          npm run build

      - name: Verify release
        run: |
          npm run verify:dist
          npm run quality -- --json --proof-dir=tmp/proof/release
          npm run verify:ha

      - name: Create Zip for HACS
        run: |
          cd custom_components/esphome_designer
          zip -r ../../esphome_designer.zip . -x "__pycache__/*" "*/__pycache__/*" "*.pyc" "frontend/tests/*"
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ESPHome Designer (cromulus) ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: esphome_designer.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
