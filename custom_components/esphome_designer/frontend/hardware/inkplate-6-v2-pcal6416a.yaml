# TARGET DEVICE: Inkplate 6 v2 (PCAL6416A)
# Name: Inkplate 6 v2 (PCAL6416A)
# Resolution: 800x600
# Shape: rect
# Orientation: landscape
# Inverted: true
# Refresh Interval: 60
# Source: https://esphome.io/components/display/inkplate/
# Revisions: https://docs.soldered.com/inkplate/touchpads/overview/
# Select by the expander fitted to your board, not just the display size.
# PCAL6416A boards use ESPHome's pca6416a component.
# Physically untested. Display-only recipe; no optional RTC or battery sensing.

esp32:
  board: esp-wrover-kit
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  speed: 80MHz

i2c:
  sda: GPIO21
  scl: GPIO22

pca6416a:
  - id: inkplate_io
    address: 0x20

display:
  - platform: inkplate
    id: my_display
    model: inkplate_6_v2
    greyscale: false
    partial_updating: false
    update_interval: 60s
    rotation: 0
    ckv_pin: GPIO32
    sph_pin: GPIO33
    gmod_pin:
      pca6416a: inkplate_io
      number: 1
    gpio0_enable_pin:
      pca6416a: inkplate_io
      number: 8
    oe_pin:
      pca6416a: inkplate_io
      number: 0
    spv_pin:
      pca6416a: inkplate_io
      number: 2
    powerup_pin:
      pca6416a: inkplate_io
      number: 4
    wakeup_pin:
      pca6416a: inkplate_io
      number: 3
    vcom_pin:
      pca6416a: inkplate_io
      number: 5
    # __LAMBDA_PLACEHOLDER__
